name: Build AgentCore Chat (Marketplace optional)
on:
  push:
    tags: ['chat-v*']
  workflow_dispatch:
    inputs:
      release_version:
        description: Chat version without chat-v prefix
        required: true
      submit_marketplace:
        description: Submit the tested image after Marketplace product configuration
        type: boolean
        default: false
permissions:
  contents: read
env:
  AWS_REGION: us-east-1
  DIRECT_PULL_ACCOUNT_ID: ${{ vars.DIRECT_PULL_ACCOUNT_ID || '317530278439' }}
  MP_MCP_REPOSITORY: solodev/agentcore-chat
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Resolve version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.release_version }}
        run: |
          version="${REQUESTED_VERSION:-${GITHUB_REF_NAME#chat-v}}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Check Chat contracts and package gateway
        run: |
          npm ci --ignore-scripts --omit=dev
          node --test test/agentcore-vpc.test.js
          npm ci --ignore-scripts --prefix products/chat
          node --test products/chat/test/*.test.mjs
          cd products/chat
          zip -q -r /tmp/chat-gateway.zip gateway.mjs package.json node_modules
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.MP_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.MP_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Resolve seller registry and reuse existing pull sharing
        id: seller
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          echo "registry=$account.dkr.ecr.$AWS_REGION.amazonaws.com" >> "$GITHUB_OUTPUT"
          bash devops/prepare-repositories.sh
      - name: Log in to seller ECR
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${{ steps.seller.outputs.registry }}"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Publish AgentCore ARM64 image
        if: ${{ inputs.submit_marketplace != true }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: products/chat/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          build-args: APP_VERSION=${{ steps.version.outputs.value }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ steps.seller.outputs.registry }}/solodev/agentcore-chat:${{ steps.version.outputs.value }}
      - name: Publish test and AppHub AMD64 image
        if: ${{ inputs.submit_marketplace != true }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: products/chat/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: APP_VERSION=${{ steps.version.outputs.value }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ steps.seller.outputs.registry }}/solodev/agentcore-chat:${{ steps.version.outputs.value }}-amd64
      - name: Publish versioned gateway and template
        if: ${{ inputs.submit_marketplace != true }}
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          SELLER_REGISTRY: ${{ steps.seller.outputs.registry }}
        run: |
          aws s3 cp /tmp/chat-gateway.zip "s3://openapi-mcp/chat/$RELEASE_VERSION/gateway.zip"
          python3 - <<'PY'
          import os,pathlib
          text=pathlib.Path('devops/cloudformation/agentcore-chat.yaml').read_text().replace('{RELEASE_VERSION}',os.environ['RELEASE_VERSION'])
          registry=os.environ['SELLER_REGISTRY']
          text=text.replace('951157235292.dkr.ecr.us-east-1.amazonaws.com',registry).replace('arn:aws:ecr:us-east-1:951157235292:repository/solodev/agentcore-chat',f"arn:aws:ecr:us-east-1:{registry.split('.')[0]}:repository/solodev/agentcore-chat")
          pathlib.Path('/tmp/agentcore-chat.yaml').write_text(text)
          PY
          aws s3 cp /tmp/agentcore-chat.yaml "s3://openapi-mcp/cloudformation/chat/$RELEASE_VERSION/agentcore-chat.yaml" --acl public-read
      - name: Marketplace submission remains an explicit later action
        if: ${{ inputs.submit_marketplace == true }}
        env:
          CHAT_MARKETPLACE_PRODUCT_ID: ${{ vars.CHAT_MARKETPLACE_PRODUCT_ID || 'prod-csnnyvqmsdz5s' }}
          CHAT_MARKETPLACE_REPOSITORY: ${{ vars.CHAT_MARKETPLACE_REPOSITORY || '709825985650.dkr.ecr.us-east-1.amazonaws.com/solodev/agentcore-chat' }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          SELLER_REGISTRY: ${{ steps.seller.outputs.registry }}
        run: bash devops/submit-chat-marketplace.sh
