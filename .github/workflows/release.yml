name: Release to AWS Marketplace

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version to build/push (no leading v)"
        required: true

env:
  DIRECT_PULL_ACCOUNT_ID: ${{ vars.DIRECT_PULL_ACCOUNT_ID || '317530278439' }}
  AWS_REGION: us-east-1
  MP_MCP_REPOSITORY: solodev/openapi-mcp
  MP_AWS_ECR: 709825985650.dkr.ecr.us-east-1.amazonaws.com

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.release_version }}" ]; then
            echo "value=${{ github.event.inputs.release_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node for deployment contract checks
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check deployment contracts
        run: |
          npm ci --ignore-scripts --omit=dev
          node test/deployment-templates.test.js
          node test/health-auth.test.js

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.MP_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.MP_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Resolve seller private ECR
        id: seller
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          echo "registry=$account.dkr.ecr.$AWS_REGION.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Prepare seller ECR repository and pull-only sharing
        run: bash devops/prepare-repositories.sh

      - name: Login to seller private ECR
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${{ steps.seller.outputs.registry }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Bedrock AgentCore Runtime requires ARM64 images specifically (confirmed
      # via a real ValidationException, not docs) -- ubuntu-latest runners are
      # x86_64, so this cross-builds via QEMU emulation rather than assuming a
      # native ARM64 runner is available.
      # provenance/sbom disabled: Buildx attaches these as extra attestation
      # manifests by default, turning the push into a multi-manifest OCI
      # image index. AWS Marketplace's scanner can't read that shape and
      # rejects the image with "UnsupportedImageType" -- confirmed by a real
      # failure after switching from plain `docker build`/`docker push` to
      # this action. Plain single-manifest push is what Marketplace expects.
      - name: Build and push image (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ steps.seller.outputs.registry }}/${{ env.MP_MCP_REPOSITORY }}:${{ steps.version.outputs.value }}

      # Cloud's verified image distribution currently accepts linux/amd64.
      # Keep the AgentCore ARM64 tag single-platform; publish AMD64 separately.
      - name: Build and push AppHub image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ steps.seller.outputs.registry }}/${{ env.MP_MCP_REPOSITORY }}:${{ steps.version.outputs.value }}-amd64

      - name: Promote the same images into Marketplace ECR
        env:
          DIRECT_ECR: ${{ steps.seller.outputs.registry }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$MP_AWS_ECR"
          for suffix in "" "-amd64"; do
            tag="$RELEASE_VERSION$suffix"
            digest=$(aws ecr describe-images --repository-name "$MP_MCP_REPOSITORY" --image-ids "imageTag=$tag" --query 'imageDetails[0].imageDigest' --output text)
            docker buildx imagetools create --prefer-index=false --tag "$MP_AWS_ECR/$MP_MCP_REPOSITORY:$tag" "$DIRECT_ECR/$MP_MCP_REPOSITORY@$digest"
            promoted=$(aws ecr describe-images --registry-id "${MP_AWS_ECR%%.*}" --repository-name "$MP_MCP_REPOSITORY" --image-ids "imageTag=$tag" --query 'imageDetails[0].imageDigest' --output text)
            test "$promoted" = "$digest"
          done

      - name: Prepare Marketplace changeset
        run: |
          cp devops/changeset.sh.dst devops/changeset.sh
          sed -i "s/{RELEASE_VERSION}/${{ steps.version.outputs.value }}/g" devops/changeset.sh

      - name: Submit AWS Marketplace changeset
        run: bash devops/changeset.sh

  package-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.release_version }}" ]; then
            echo "value=${{ github.event.inputs.release_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Same shape as the AMI's own npm ci --omit=dev: this is a prebuilt
      # artifact, not a source checkout, so node_modules ships in the zip and
      # the AMI build never runs npm (or git) against this repo at all.
      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Build release archive
        run: zip -q -r openapi-mcp.zip package.json package-lock.json src node_modules

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.MP_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.MP_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload release archive to S3
        run: |
          aws s3 cp openapi-mcp.zip "s3://openapi-mcp/openapi-mcp-${{ steps.version.outputs.value }}.zip"
          aws s3 cp openapi-mcp.zip "s3://openapi-mcp/openapi-mcp-latest.zip"

      # Public read is required here (unlike the zip above): AWS CloudFormation's
      # "Create Stack" console page fetches templateURL directly from the
      # customer's own browser, cross-account, with no credentials at all -- so
      # this object has to be fetchable over plain HTTPS. If the bucket has S3
      # Object Ownership set to "Bucket owner enforced", ACLs are disabled and
      # the bucket policy must grant public s3:GetObject on cloudformation/*.
      - name: Upload OpenAPI MCP CFTs to S3
        run: |
          for template in agentcore-runtime private-ecs apphub-ecs cms-apphub-ecs; do
            cp "devops/cloudformation/${template}.yaml" "/tmp/${template}.yaml"
            sed -i "s/{RELEASE_VERSION}/${{ steps.version.outputs.value }}/g" "/tmp/${template}.yaml"
            aws s3 cp "/tmp/${template}.yaml" \
              "s3://openapi-mcp/cloudformation/${template}.yaml" \
              --acl public-read
            aws s3 cp "/tmp/${template}.yaml" \
              "s3://openapi-mcp/cloudformation/${{ steps.version.outputs.value }}/${template}.yaml" \
              --acl public-read
          done

      - name: Upload EKS deployment manifest
        run: |
          aws s3 cp devops/kubernetes/openapi-mcp.yaml \
            s3://openapi-mcp/kubernetes/openapi-mcp.yaml --acl public-read
