apiVersion: apps/v1
kind: Deployment
metadata:
  name: openapi-mcp
spec:
  replicas: 1
  selector:
    matchLabels: {app: openapi-mcp}
  template:
    metadata:
      labels: {app: openapi-mcp}
    spec:
      # Match this to the delivery image; current OpenAPI MCP releases are ARM64.
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mcp
          image: REPLACE_WITH_SUBSCRIBED_IMAGE_URI
          ports:
            - {name: http, containerPort: 8000}
          env:
            - {name: HOST, value: '0.0.0.0'}
            - {name: PORT, value: '8000'}
            - {name: REQUIRE_AUTH, value: 'true'}
            - name: OPENAPI_URL
              valueFrom: {configMapKeyRef: {name: openapi-mcp, key: openapi-url}}
            - name: API_BASE_URL
              valueFrom: {configMapKeyRef: {name: openapi-mcp, key: api-base-url}}
            - name: MCP_AUTH_TOKEN
              valueFrom: {secretKeyRef: {name: openapi-mcp-auth, key: mcp-token}}
            - name: OPENAPI_AUTH_TOKEN
              valueFrom: {secretKeyRef: {name: openapi-mcp-auth, key: api-token}}
            - name: API_TOKEN
              valueFrom: {secretKeyRef: {name: openapi-mcp-auth, key: api-token}}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: '1', memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: openapi-mcp
spec:
  type: ClusterIP
  selector: {app: openapi-mcp}
  ports:
    - {name: http, port: 8000, targetPort: http}
