AWSTemplateFormatVersion: '2010-09-09'
Description: >
  OpenAPI MCP on Amazon Bedrock AgentCore Runtime. Creates an AgentCore
  runtime for the Marketplace OpenAPI MCP container and configures it to
  generate tools from a target OpenAPI or Swagger document.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Container Image
        Parameters:
          - ContainerImageUri
      - Label:
          default: Target API
        Parameters:
          - OpenApiUrl
          - ApiBaseUrl
          - OpenApiAuthToken
      - Label:
          default: MCP Server Options (optional)
        Parameters:
          - McpAuthToken
          - AllowedTools

    ParameterLabels:
      ContainerImageUri:  { default: Container Image URI }
      OpenApiUrl:         { default: OpenAPI/Swagger URL }
      ApiBaseUrl:         { default: API Base URL }
      OpenApiAuthToken:   { default: Target API Bearer Token }
      McpAuthToken:       { default: MCP Server Bearer Token }
      AllowedTools:       { default: Allowed Tools (comma-separated) }

Parameters:

  # ── Container image ────────────────────────────────────────────────────────
  ContainerImageUri:
    Type: String
    Default: 709825985650.dkr.ecr.us-east-1.amazonaws.com/solodev/openapi-mcp:{RELEASE_VERSION}
    Description: >
      ECR image URI for OpenAPI MCP, including tag. Must be pushed to an ECR
      repository the AgentCore execution role can pull from.

  NetworkMode:
    Type: String
    Default: PUBLIC
    AllowedValues: [PUBLIC, VPC]
  RuntimeSubnets:
    Type: CommaDelimitedList
    Default: ''
    Description: CMS VPC subnets with NAT or the required AWS service endpoints.
  RuntimeSecurityGroups:
    Type: CommaDelimitedList
    Default: ''
    Description: Existing runtime security groups, used only when VpcId is not supplied.
  VpcId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^vpc-[a-f0-9]+$'
    Description: CMS VPC ID. When provided in VPC mode, this stack creates its own runtime security group.
  CmsSecurityGroupId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^sg-[a-f0-9]+$'
    Description: Optional CMS load balancer or API security group. This stack owns only the added access rule.
  CmsPort:
    Type: Number
    Default: 443
    MinValue: 1
    MaxValue: 65535
    Description: CMS API listener port allowed from this runtime's security group.

  # ── Target API ─────────────────────────────────────────────────────────────
  OpenApiUrl:
    Type: String
    Description: >
      URL to the target API's OpenAPI/Swagger specification that this MCP
      server should expose as tools. Example: https://your-api.example.com/openapi.json

  ApiBaseUrl:
    Type: String
    Description: >
      Base URL of the target API that generated tools should call.
      Example: https://your-api.example.com

  OpenApiAuthToken:
    Type: String
    Default: ''
    NoEcho: true
    Description: >
      Optional. Bearer token used when calling protected endpoints on the
      target API.

  # ── MCP server options ─────────────────────────────────────────────────────
  McpAuthToken:
    Type: String
    Default: ''
    NoEcho: true
    Description: >
      Optional. Bearer token required of MCP clients calling this server
      directly (outside of AgentCore Runtime's own access controls). Leave
      blank to rely solely on AgentCore Runtime's own inbound auth.

  AllowedTools:
    Type: String
    Default: ''
    Description: >
      Optional. Comma-separated allowlist of tool names to expose. Leave
      blank to expose every tool generated from the OpenAPI spec.

Rules:
  CmsIngressRequiresVpc:
    RuleCondition: !Not [!Equals [!Ref CmsSecurityGroupId, '']]
    Assertions:
      - Assert: !And [!Equals [!Ref NetworkMode, VPC], !Not [!Equals [!Ref VpcId, '']]]
        AssertDescription: A CMS listener access rule requires VPC mode and its VPC ID.
  PrivateNetworkConfigured:
    RuleCondition: !Equals [!Ref NetworkMode, VPC]
    Assertions:
      - Assert: !Not [!Contains [!Ref RuntimeSubnets, '']]
        AssertDescription: VPC mode requires runtime subnet IDs.
      - Assert: !Or [!Not [!Equals [!Ref VpcId, '']], !Not [!Contains [!Ref RuntimeSecurityGroups, '']]]
        AssertDescription: VPC mode requires a CMS VPC ID or existing runtime security groups.
Conditions:
  PrivateRuntime: !Equals [!Ref NetworkMode, VPC]
  CreateRuntimeGroup: !And [!Condition PrivateRuntime, !Not [!Equals [!Ref VpcId, '']]]
  ConnectCmsGroup: !And [!Condition CreateRuntimeGroup, !Not [!Equals [!Ref CmsSecurityGroupId, '']]]
  HasOpenApiAuthToken: !Not [!Equals [!Ref OpenApiAuthToken, '']]
  HasMcpAuthToken:     !Not [!Equals [!Ref McpAuthToken, '']]
  HasAllowedTools:     !Not [!Equals [!Ref AllowedTools, '']]

Resources:
  AgentCoreSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: CreateRuntimeGroup
    Properties:
      GroupDescription: AgentCore runtime access to CMS and AWS HTTPS services
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - !If
          - ConnectCmsGroup
          - IpProtocol: tcp
            FromPort: !Ref CmsPort
            ToPort: !Ref CmsPort
            DestinationSecurityGroupId: !Ref CmsSecurityGroupId
          - !Ref AWS::NoValue
  CmsRuntimeIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: ConnectCmsGroup
    Properties:
      Description: Access from this AgentCore runtime only
      GroupId: !Ref CmsSecurityGroupId
      IpProtocol: tcp
      FromPort: !Ref CmsPort
      ToPort: !Ref CmsPort
      SourceSecurityGroupId: !Ref AgentCoreSecurityGroup

  # ── Execution role (assumed by the AgentCore runtime process) ──────────────
  AgentCoreExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-exec-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: OpenApiMcpExecutionPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EcrPull
                Effect: Allow
                Action:
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:BatchCheckLayerAvailability
                Resource: '*'
              - Sid: EcrAuth
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/*'

  # ── Scoped IAM user + key for external callers (e.g. Osirus) to invoke this
  # runtime directly -- same pattern as provider-agentcore.yaml's OsirusUser,
  # scoped tighter (just invoke, not full runtime management) and to just
  # this stack's runtime ARN rather than '*'.
  McpInvokerUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub '${AWS::StackName}-mcp-invoker'
      Policies:
        - PolicyName: InvokeOpenApiMcpRuntime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AgentCoreInvoke
                Effect: Allow
                Action:
                  - bedrock-agentcore:InvokeAgentRuntime
                  - bedrock-agentcore:GetAgentCard
                Resource:
                  - !GetAtt AgentCoreRuntime.RuntimeArn
                  - !Sub '${AgentCoreRuntime.RuntimeArn}/runtime-endpoint/*'

  McpInvokerAccessKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref McpInvokerUser

  # ── Lambda execution role (for the custom resource) ────────────────────────
  RuntimeProvisionerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-provisioner-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AgentCoreRuntimeManagement
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock-agentcore:CreateAgentRuntime
                  - bedrock-agentcore:UpdateAgentRuntime
                  - bedrock-agentcore:DeleteAgentRuntime
                  - bedrock-agentcore:GetAgentRuntime
                  - bedrock-agentcore:CreateAgentRuntimeEndpoint
                  - bedrock-agentcore:UpdateAgentRuntimeEndpoint
                  - bedrock-agentcore:DeleteAgentRuntimeEndpoint
                  - bedrock-agentcore:GetAgentRuntimeEndpoint
                  - bedrock-agentcore:CreateWorkloadIdentity
                  - bedrock-agentcore:DeleteWorkloadIdentity
                  - bedrock-agentcore:GetWorkloadIdentity
                Resource: '*'
              - Effect: Allow
                Action: ['iam:PassRole']
                Resource: !GetAtt AgentCoreExecutionRole.Arn
              - Effect: Allow
                Action: ['iam:CreateServiceLinkedRole']
                Resource: '*'

  # ── Lambda that creates / updates / deletes the AgentCore runtime ──────────
  RuntimeProvisionerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-provisioner'
      Runtime: python3.12
      Handler: index.handler
      Timeout: 300
      Role: !GetAtt RuntimeProvisionerRole.Arn
      Code:
        ZipFile: |
          import boto3, json, urllib.request, time

          SUCCESS = 'SUCCESS'
          FAILED  = 'FAILED'

          def send(event, ctx, status, data, physical_id=None):
              body = json.dumps({
                  'Status': status,
                  'Reason': data.get('Error', 'See CloudWatch logs'),
                  'PhysicalResourceId': physical_id or ctx.log_stream_name,
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': data,
              }).encode()
              req = urllib.request.Request(
                  event['ResponseURL'],
                  data=body,
                  headers={'Content-Type': '', 'Content-Length': len(body)},
                  method='PUT',
              )
              urllib.request.urlopen(req)

          def handler(event, ctx):
              props        = event.get('ResourceProperties', {})
              region       = props.get('Region')
              role_arn     = props.get('RoleArn')
              container_uri = props.get('ContainerUri')
              name         = props.get('AgentName')
              desc         = props.get('AgentDescription', '')
              env_vars     = props.get('EnvironmentVariables', {})
              runtime_name = name.replace('-', '_')

              try:
                  # Ensure the AgentCore service-linked role exists before calling CreateAgentRuntime
                  iam = boto3.client('iam')
                  try:
                      iam.create_service_linked_role(AWSServiceName='bedrock-agentcore.amazonaws.com')
                  except Exception:
                      pass  # already exists -- safe to ignore

                  client = boto3.client('bedrock-agentcore-control', region_name=region)
                  runtime_artifact = {
                      'containerConfiguration': {
                          'containerUri': container_uri,
                      },
                  }
                  protocol_configuration = {'serverProtocol': 'MCP'}
                  network = {'networkMode': props.get('NetworkMode', 'PUBLIC')}
                  if event['RequestType'] != 'Delete' and network['networkMode'] == 'VPC':
                      subnets = props.get('RuntimeSubnets', [])
                      groups = props.get('RuntimeSecurityGroups', [])
                      if not subnets or not groups or any(not value for value in subnets + groups):
                          raise ValueError('VPC mode requires subnet and security group IDs')
                      network['networkModeConfig'] = {'subnets': subnets, 'securityGroups': groups}
                      try:
                          iam.create_service_linked_role(AWSServiceName='network.bedrock-agentcore.amazonaws.com')
                      except iam.exceptions.InvalidInputException as error:
                          if 'already exists' not in str(error).lower():
                              raise


                  if event['RequestType'] == 'Create':
                      resp = client.create_agent_runtime(
                          agentRuntimeName=runtime_name,
                          description=desc,
                          roleArn=role_arn,
                          networkConfiguration=network,
                          agentRuntimeArtifact=runtime_artifact,
                          protocolConfiguration=protocol_configuration,
                          environmentVariables=env_vars,
                      )
                      arn = resp.get('agentRuntimeArn') or resp.get('AgentRuntimeArn', '')
                      send(event, ctx, SUCCESS, {'RuntimeArn': arn, 'RuntimeId': arn.split('/')[-1]}, arn)

                  elif event['RequestType'] == 'Update':
                      physical = event.get('PhysicalResourceId', '')
                      runtime_id = physical.split('/')[-1] if physical else ''
                      if not runtime_id:
                          raise Exception('Missing AgentCore runtime physical resource id for update')
                      resp = client.update_agent_runtime(
                          agentRuntimeId=runtime_id,
                          description=desc,
                          roleArn=role_arn,
                          networkConfiguration=network,
                          agentRuntimeArtifact=runtime_artifact,
                          protocolConfiguration=protocol_configuration,
                          environmentVariables=env_vars,
                      )
                      arn = resp.get('agentRuntimeArn') or resp.get('AgentRuntimeArn') or physical
                      send(event, ctx, SUCCESS, {'RuntimeArn': arn, 'RuntimeId': runtime_id}, arn)

                  elif event['RequestType'] == 'Delete':
                      physical = event.get('PhysicalResourceId', '')
                      if physical and 'bedrock-agentcore' in physical:
                          runtime_id = physical.split('/')[-1]
                          try:
                              client.delete_agent_runtime(agentRuntimeId=runtime_id)
                          except Exception as error:
                              if getattr(error, 'response', {}).get('Error', {}).get('Code') != 'ResourceNotFoundException':
                                  raise
                          deadline = time.monotonic() + 240
                          while time.monotonic() < deadline:
                              try:
                                  client.get_agent_runtime(agentRuntimeId=runtime_id)
                              except Exception as error:
                                  if getattr(error, 'response', {}).get('Error', {}).get('Code') == 'ResourceNotFoundException':
                                      break
                                  raise
                              time.sleep(3)
                          else:
                              raise TimeoutError('Runtime deletion is still in progress; retry stack deletion.')
                      send(event, ctx, SUCCESS, {}, physical)

              except Exception as exc:
                  send(event, ctx, FAILED, {'Error': str(exc)})

  # ── Custom resource -- triggers the Lambda to create the runtime ───────────
  AgentCoreRuntime:
    Type: Custom::AgentCoreRuntime
    DependsOn: AgentCoreExecutionRole
    Properties:
      ServiceToken: !GetAtt RuntimeProvisionerFunction.Arn
      NetworkMode: !Ref NetworkMode
      RuntimeSubnets: !Ref RuntimeSubnets
      RuntimeSecurityGroups: !If [CreateRuntimeGroup, [!Ref AgentCoreSecurityGroup], !Ref RuntimeSecurityGroups]
      Region: !Ref AWS::Region
      RoleArn: !GetAtt AgentCoreExecutionRole.Arn
      ContainerUri: !Ref ContainerImageUri
      AgentName: !Ref AWS::StackName
      AgentDescription: OpenAPI MCP -- Model Context Protocol server for the configured target API
      EnvironmentVariables:
        OPENAPI_URL: !Ref OpenApiUrl
        API_BASE_URL: !Ref ApiBaseUrl
        OPENAPI_AUTH_TOKEN: !If [HasOpenApiAuthToken, !Ref OpenApiAuthToken, !Ref 'AWS::NoValue']
        MCP_AUTH_TOKEN: !If [HasMcpAuthToken, !Ref McpAuthToken, !Ref 'AWS::NoValue']
        MCP_ALLOWED_TOOLS: !If [HasAllowedTools, !Ref AllowedTools, !Ref 'AWS::NoValue']
        REQUIRE_AUTH: !If [HasMcpAuthToken, 'true', 'false']

Outputs:
  RuntimeNetworkMode:
    Value: !Ref NetworkMode
  RuntimeSecurityGroupId:
    Condition: CreateRuntimeGroup
    Value: !Ref AgentCoreSecurityGroup

  RuntimeArn:
    Description: AgentCore Runtime ARN -- paste into the Osirus OpenAPI MCP provider connection (or any other MCP client's Runtime ARN field).
    Value: !GetAtt AgentCoreRuntime.RuntimeArn

  AccessKeyId:
    Description: AWS Access Key ID for invoking this runtime -- paste into the Osirus OpenAPI MCP provider connection.
    Value: !Ref McpInvokerAccessKey

  SecretAccessKey:
    Description: AWS Secret Access Key for invoking this runtime -- paste into the Osirus OpenAPI MCP provider connection.
    Value: !GetAtt McpInvokerAccessKey.SecretAccessKey

  Region:
    Description: AWS Region.
    Value: !Ref AWS::Region

  ExecutionRoleArn:
    Description: IAM role assumed by the AgentCore runtime process.
    Value: !GetAtt AgentCoreExecutionRole.Arn
