AWSTemplateFormatVersion: '2010-09-09'
Description: OpenAPI MCP for one API on an existing AppHub ECS/Fargate cluster and HTTPS listener.
Parameters:
  CloudImageMcp:
    Type: String
    Description: Version-pinned subscribed Marketplace image URI; use the image supplied by your delivery option.
  CpuArchitecture:
    Type: String
    Default: ARM64
    AllowedValues: [ARM64, X86_64]
    Description: Must match the selected image. The OpenAPI MCP release image currently targets ARM64.
  Cluster:
    Type: String
    Description: Existing AppHub ECS cluster name or ARN.
  VPCID:
    Type: AWS::EC2::VPC::Id
  Subnets:
    Type: List<AWS::EC2::Subnet::Id>
    Description: AppHub task subnets with access to the image registry, Secrets Manager, logs and target API.
  LoadBalancerSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group attached to the existing AppHub load balancer.
  ExistingListenerArn:
    Type: String
    Description: Existing HTTPS Application Load Balancer listener ARN. Its certificate must cover HostName.
  HostName:
    Type: String
    AllowedPattern: '^[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?)+$'
    Description: Unique MCP hostname already covered by the listener certificate; point DNS to the AppHub ALB.
  ListenerPriority:
    Type: Number
    MinValue: 1
    MaxValue: 50000
    Description: Unused priority on the shared listener; AppHub should allocate it.
  OpenApiUrl:
    Type: String
    AllowedPattern: '^https?://.+$'
    Description: This installation's OpenAPI JSON/YAML URL, reachable from the task subnets.
  ApiBaseUrl:
    Type: String
    AllowedPattern: '^https?://.+$'
    Description: This installation's API base URL, reachable from the task subnets.
  McpAuthSecretArn:
    Type: String
    AllowedPattern: '^arn:[^:]+:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'
    Description: Existing Secrets Manager secret containing the raw MCP bearer token, in this Region. Never put the token in this parameter.
  ApiAuthSecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:[^:]+:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'
    Description: Optional existing secret containing the raw target API bearer token, in this Region.
  SecretsKmsKeyArn:
    Type: String
    Default: ''
    Description: Customer-managed KMS key ARN if the supplied secrets use one; omit for the default Secrets Manager key.
  CmsPolicyUrl:
    Type: String
    Default: ''
    AllowedPattern: '^$|^https://[a-z0-9][a-z0-9.-]+[a-z0-9]/mcp/info$'
    Description: Optional CMS-managed MCP policy URL. Disabled or unavailable policy grants no tools.
  AllowedTools:
    Type: String
    Default: ''
    Description: Optional comma-separated tool allowlist.
  AssignPublicIp:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 10
Conditions:
  HasApiAuth: !Not [!Equals [!Ref ApiAuthSecretArn, '']]
  HasSecretsKey: !Not [!Equals [!Ref SecretsKmsKeyArn, '']]
Resources:
  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14
  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: MCP traffic from the existing AppHub ALB only
      VpcId: !Ref VPCID
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroupId
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadInstallationSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref McpAuthSecretArn
                  - !If [HasApiAuth, !Ref ApiAuthSecretArn, !Ref 'AWS::NoValue']
              - !If
                - HasSecretsKey
                - Effect: Allow
                  Action: kms:Decrypt
                  Resource: !Ref SecretsKmsKeyArn
                  Condition:
                    StringEquals:
                      kms:ViaService: !Sub secretsmanager.${AWS::Region}.${AWS::URLSuffix}
                - !Ref AWS::NoValue
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform:
        CpuArchitecture: !Ref CpuArchitecture
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: mcp
          Image: !Ref CloudImageMcp
          Essential: true
          PortMappings:
            - ContainerPort: 8000
          Environment:
            - {Name: PORT, Value: '8000'}
            - {Name: HOST, Value: '0.0.0.0'}
            - {Name: REQUIRE_AUTH, Value: 'true'}
            - Name: PUBLIC_BASE_URL
              Value: !Sub https://${HostName}
            - {Name: OPENAPI_URL, Value: !Ref OpenApiUrl}
            - {Name: API_BASE_URL, Value: !Ref ApiBaseUrl}
            - {Name: MCP_ALLOWED_TOOLS, Value: !Ref AllowedTools}
            - {Name: CMS_MCP_POLICY_URL, Value: !Ref CmsPolicyUrl}
          Secrets:
            - {Name: MCP_AUTH_TOKEN, ValueFrom: !Ref McpAuthSecretArn}
            - !If
              - HasApiAuth
              - {Name: OPENAPI_AUTH_TOKEN, ValueFrom: !Ref ApiAuthSecretArn}
              - !Ref AWS::NoValue
            - !If
              - HasApiAuth
              - {Name: API_TOKEN, ValueFrom: !Ref ApiAuthSecretArn}
              - !Ref AWS::NoValue
          HealthCheck:
            Command: [CMD-SHELL, 'node -e "require(''http'').get(''http://127.0.0.1:8000/health'',r=>process.exit(r.statusCode===200?0:1)).on(''error'',()=>process.exit(1))"']
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref Logs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: mcp
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VPCID
      Port: 8000
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /health
      Matcher: {HttpCode: '200'}
  ListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ExistingListenerArn
      Priority: !Ref ListenerPriority
      Conditions:
        - Field: host-header
          Values: [!Ref HostName]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup
  Service:
    Type: AWS::ECS::Service
    DependsOn: ListenerRule
    Properties:
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      HealthCheckGracePeriodSeconds: 90
      DeploymentConfiguration:
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: !Ref AssignPublicIp
          Subnets: !Ref Subnets
          SecurityGroups: [!GetAtt ServiceSecurityGroup.GroupId]
      LoadBalancers:
        - ContainerName: mcp
          ContainerPort: 8000
          TargetGroupArn: !Ref TargetGroup
Outputs:
  McpUrl:
    Value: !Sub https://${HostName}/mcp
  HealthUrl:
    Value: !Sub https://${HostName}/health
  ServiceArn:
    Value: !Ref Service
  ServiceSecurityGroupId:
    Value: !GetAtt ServiceSecurityGroup.GroupId
